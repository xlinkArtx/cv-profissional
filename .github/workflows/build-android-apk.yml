name: Build Android APK

on:
  push:
    branches:
      - build/android-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor for Android
        run: npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6

      - name: Build website
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Copy website into Android app
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CV-Profissional-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
